# Construit l'application Android de Block Quarry (Capacitor) :
# - APK de test (installable directement sur un téléphone) à chaque changement du jeu ;
# - AAB de publication signé avec la clé d'envoi (secrets BQ_UPLOAD_*), à déposer sur Google Play ;
# - envoi automatique sur la piste « internal » de Google Play si le secret PLAY_SERVICE_ACCOUNT_JSON existe.
name: Android — Block Quarry

on:
  push:
    branches: [main]
    paths:
      - 'apps/block-quarry/**'
      - 'js/blocks.js'
      - 'js/i18n.js'
      - 'css/style.css'
      - 'index.html'
      - '.github/workflows/android-block-quarry.yml'
  workflow_dispatch:

concurrency:
  group: android-block-quarry
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/block-quarry
    env:
      # identifiants AdMob réels : variables du dépôt (Settings → Variables) ; à défaut, identifiants de test Google
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/block-quarry/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web → www/ → projet Android
        run: |
          npm ci
          node build.mjs
          npx cap sync android
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Clé d'envoi (si configurée)
        env:
          KEYSTORE_B64: ${{ secrets.BQ_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signature : clé d'envoi"
          else
            echo "::warning::Secret BQ_UPLOAD_KEYSTORE_BASE64 absent : l'AAB ne sera pas signé (APK de test seulement)."
          fi

      - name: Gradle — APK de test et AAB de publication
        working-directory: apps/block-quarry/android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.BQ_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.BQ_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.BQ_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          ls -l app/build/outputs/apk/debug app/build/outputs/bundle/release

      - uses: actions/upload-artifact@v4
        with:
          name: block-quarry-${{ env.VERSION_NAME }}-${{ github.run_number }}-debug-apk
          path: apps/block-quarry/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD_KEYSTORE_PATH != ''
        with:
          name: block-quarry-${{ env.VERSION_NAME }}-${{ github.run_number }}-release-aab
          path: apps/block-quarry/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Google Play — piste interne (si le compte de service est configuré)
        if: env.UPLOAD_KEYSTORE_PATH != '' && github.ref == 'refs/heads/main'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "Pas de compte de service : dépôt manuel de l'AAB dans la Play Console."; exit 0; fi
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          npm install --no-save googleapis@144
          node tools/play-upload.mjs "$RUNNER_TEMP/play.json" android/app/build/outputs/bundle/release/app-release.aab internal
